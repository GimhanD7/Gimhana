name: Deploy portfolio to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    environment:
      name: namecheap-production
      url: https://gimhan.web.lk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build and package the site
        run: |
          npm ci --legacy-peer-deps
          CI=false REACT_APP_API_URL=/api/index.php npm run build
          php -l api/index.php
          php -l api/bootstrap.php
          php -l api/config.php
          mkdir -p build/api/uploads
          cp deploy/namecheap.htaccess build/.htaccess
          cp api/{index,bootstrap,config}.php build/api/
          cp api/uploads/.htaccess build/api/uploads/
          git ls-files -z 'api/uploads/*.jpg' 'api/uploads/*.jpeg' 'api/uploads/*.png' 'api/uploads/*.webp' |
            xargs -0 -r cp -t build/api/uploads/

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.NAMECHEAP_HOST }}
          DEPLOY_USER: ${{ vars.NAMECHEAP_USER }}
          DEPLOY_ROOT: ${{ vars.NAMECHEAP_DOCUMENT_ROOT }}
          DEPLOY_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
        run: |
          invalid_settings=0
          if [[ ! "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo "::error::NAMECHEAP_HOST is missing or invalid. Enter the hosting hostname or IP address."
            invalid_settings=1
          fi
          if [[ ! "$DEPLOY_USER" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]]; then
            echo "::error::NAMECHEAP_USER is missing or invalid. Enter the cPanel SSH username."
            invalid_settings=1
          fi
          if [[ ! "$DEPLOY_ROOT" =~ ^/home[0-9]*/[a-zA-Z0-9_-]+(/[a-zA-Z0-9._-]+)+/?$ ||
                "$DEPLOY_ROOT/" == *"/../"* || "$DEPLOY_ROOT/" == *"/./"* ]]; then
            echo "::error::NAMECHEAP_DOCUMENT_ROOT is missing or invalid. Enter the absolute document root from cPanel."
            invalid_settings=1
          fi
          if [[ -z "$DEPLOY_KEY" ]]; then
            echo "::error::NAMECHEAP_SSH_PRIVATE_KEY is missing from the namecheap-production environment secrets."
            invalid_settings=1
          fi
          if [[ -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo "::error::NAMECHEAP_KNOWN_HOSTS is missing from the namecheap-production environment secrets."
            invalid_settings=1
          fi
          if (( invalid_settings )); then
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/namecheap
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_opts=(-p 21098 -i "$HOME/.ssh/namecheap" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes)
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${ssh_opts[@]}" "$destination" "test -d '$DEPLOY_ROOT' && command -v rsync >/dev/null"
          export RSYNC_RSH="ssh ${ssh_opts[*]}"
          rsync -az --delay-updates --include='/api/uploads/.htaccess' --exclude='/api/uploads/*' \
            build/ "$destination:${DEPLOY_ROOT%/}/"
          rsync -az --ignore-existing --exclude='.htaccess' \
            build/api/uploads/ "$destination:${DEPLOY_ROOT%/}/api/uploads/"

      - name: Verify routing and database-backed API
        run: |
          site=https://gimhan.web.lk
          echo "Checking React projects page"
          curl -fsS --max-time 20 "$site/projects" -o "$RUNNER_TEMP/portfolio.html"
          grep -Fq 'id="root"' "$RUNNER_TEMP/portfolio.html"
          echo "Checking PHP API database connection (action=health)"
          curl -fsS --max-time 20 "$site/api/index.php?action=health" -o "$RUNNER_TEMP/health.json"
          jq -e '.status == "ok"' "$RUNNER_TEMP/health.json" >/dev/null
          echo "Checking projects data (action=projects)"
          curl -fsS --max-time 20 "$site/api/index.php?action=projects" -o "$RUNNER_TEMP/projects.json"
          jq -e '.projects | type == "array"' "$RUNNER_TEMP/projects.json" >/dev/null
